
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking Confirmed - FixMate</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <section class="success-section">

        <div class="success-container">

            <div class="success-icon">✓</div>

            <h1>Booking Submitted!</h1>

            <p>Your booking details have been saved successfully.</p>

            <div class="booking-details">

                <h3>Booking Details</h3>

                <p><strong>Booking ID:</strong> <span id="bookingId"></span></p>

                <p><strong>Name:</strong> <span id="showName"></span></p>

                <p><strong>Mobile:</strong> <span id="showMobile"></span></p>

                <p><strong>Service:</strong> <span id="showService"></span></p>

                <p><strong>Date:</strong> <span id="showDate"></span></p>

                <p><strong>Time:</strong> <span id="showTime"></span></p>

                <p><strong>Address:</strong> <span id="showAddress"></span></p>

            </div>

            <a href="index.html" class="home-link">
                Back to Home
            </a>

        </div>

    </section>

    <script src="script.js"></script>

</body>
</html>
